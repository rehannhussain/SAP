<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Finishing — Sanforizing Entry</title>

	<style>
		html, body, #content {
			height: 100%;
			margin: 0;
		}
		/* stretch the root XML view so the Page fills the viewport
		   (otherwise the Page collapses to its footer height) */
		#content .sapUiView {
			height: 100%;
		}
		/* simple pulsing "machine running" animation */
		@keyframes finPulse {
			0%   { opacity: 1;   transform: scale(1); }
			50%  { opacity: 0.35; transform: scale(0.82); }
			100% { opacity: 1;   transform: scale(1); }
		}
		.finRunning .sapUiIcon {
			animation: finPulse 1s ease-in-out infinite;
			color: #107e3e;
		}

		/* top-left logo in the header */
		.finLogo { height: 2rem; margin-right: 0.75rem; }

		/* prominent SAP-themed action toolbar (start/stop, times, save/clear) */
		.finActionBar.sapMTB {
			min-height: 3.25rem;
			padding-top: 0.25rem;
			padding-bottom: 0.25rem;
			border-bottom: 3px solid var(--sapButton_Emphasized_Background, #0a6ed1);
			box-shadow: inset 0 3px 0 0 var(--sapButton_Emphasized_Background, #0a6ed1);
		}
		.finActionBar .sapMLabel { font-weight: 700; }
		.finActionBar .sapMObjectStatus { font-weight: 700; }

		/* machine times shown on their own line under the action toolbar */
		.finTimesBar.sapMTB {
			margin: 0.5rem 0.5rem 0;
			min-height: 2.75rem;
			border: 1px solid var(--sapGroup_ContentBorderColor, #e5e5e5);
			border-radius: 0.5rem;
			background: var(--sapObjectHeader_Background, #fff);
		}
	</style>

	<!-- Local QR decoder (jsQR, MIT) for the iPad camera scan button. -->
	<script src="lib/jsQR.js"></script>

	<!-- UI5 is loaded from the OpenUI5 runtime hosted locally by Flask
	     (webapp/resources/, gitignored). This serves at LAN speed and works
	     with no internet. See CLAUDE.md for how to re-download the runtime.
	     To fall back to the public CDN, set src to
	     https://sdk.openui5.org/1.120.30/resources/sap-ui-core.js -->
	<script
		id="sap-ui-bootstrap"
		src="resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resourceroots='{"finishing.sanfor": "./"}'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true">
	</script>
</head>
<body class="sapUiBody">
	<div
		id="content"
		class="sapUiSizeCompact"
		data-sap-ui-component
		data-name="finishing.sanfor"
		data-id="container"
		data-height="100%"
		data-settings='{"id": "finishingApp"}'>
	</div>
</body>
</html>
